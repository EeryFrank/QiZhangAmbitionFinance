name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both modules and documentation
        run: bash ./gradlew --no-daemon --console=plain clean build
      - uses: actions/upload-artifact@v4
        with:
          name: QiZhangAmbitionFinance-neoforge-26.3
          path: |
            finance/build/libs/*.jar
            cozylife-integration/build/libs/*.jar
          if-no-files-found: error
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-test-reports
          path: |
            finance/build/reports/tests/
            finance/build/test-results/
          if-no-files-found: ignore
